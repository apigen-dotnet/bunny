prune = true
output_path = "src"
target_framework = "net10.0"
generate_nullable_reference_types = true
generate_data_annotations = true

global_usings = [
    "System.Text.Json.Serialization"
]

[[specs]]
path = "specs/origin-errors.json"
path_prefix = ""

[models]
namespace = "Apigen.Bunny.OriginErrors.Models"
project_name = "Apigen.Bunny.OriginErrors.Models"

[model_generation]
strategy = "SeparateWithDeduplication"

[enum_generation]
generation_mode = "Raw"
add_json_string_enum_converter = true
add_json_string_enum_member_name = true

[serialization]
nullable_for_optional_properties = true
ignore_condition = "WhenWritingNull"

[client]
strip_common_path_prefix = false
detect_response_wrappers = false
generate_client = true
namespace = "Apigen.Bunny.OriginErrors"
project_name = "Apigen.Bunny.OriginErrors"
client_class_name = "BunnyOriginErrorsClient"
use_async_suffix = true
generate_interfaces = true

[client.request_organization]
strategy = "individual_files"
directory = "Requests"
include_base_classes = true

[client.authentication]
token_header = "AccessKey"
required_headers = []

[naming]
acronyms = { IPs = "Ips", IP = "Ip", SSH = "Ssh", URL = "Url", ID = "Id", IDs = "Ids", DNS = "Dns", ISO = "Iso", LB = "Lb", VPC = "Vpc", IPv4 = "IPv4", IPv6 = "IPv6" }
stop_words = ["a", "an", "the", "of", "for", "to", "from", "by"]

[formatting]
use_spaces = true
indent_width = 2

[header]
include_header = true
include_timestamp = false
include_source = true
include_generator_info = true
include_config_info = false
custom_text = "Bunny OriginErrors API Client - Auto-generated from OpenAPI specification"
